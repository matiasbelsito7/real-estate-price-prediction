[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"


[project]
name = "real-estate-price-prediction"
version = "0.1.0"
description = "End-to-end data science project for residential real estate price prediction."
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    # Data
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",

    # Web scraping
    "requests>=2.32,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0,<7.0",

    # Machine Learning
    "scikit-learn>=1.5,<2.0",
    "xgboost>=2.1,<4.0",

    # Experiment tracking
    "mlflow>=3.0,<4.0",

    # Explainability
    "shap>=0.46,<1.0",

    # API / Serving (Fase 10)
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "slowapi>=0.1.9,<1.0",

    # Persistencia en PostgreSQL (Fase 12)
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",

    # Configuration
    "pydantic-settings>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",

    # Environment variables
    "python-dotenv>=1.0,<2.0",
]


[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "httpx>=0.27,<1.0",

    # Code quality
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",

    # Type stubs
    "pandas-stubs>=2.2,<3.0",
    "types-PyYAML>=6.0,<7.0",
    "types-requests>=2.0,<3.0",

    # Git hooks
    "pre-commit>=4.0,<5.0",

    # Jupyter
    "jupyter>=1.0,<2.0",
    "ipykernel>=6.0,<7.0",

    # Visualización (EDA)
    "matplotlib>=3.8,<4.0",

    # Versionado de datos
    "dvc>=3.0,<4.0",
]



[tool.setuptools.packages.find]
where = ["src"]


# ============================================================
# Pytest
# ============================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]


# ============================================================
# Ruff
# ============================================================

[tool.ruff]
line-length = 100
target-version = "py311"

src = ["src", "tests"]

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "data",
    "mlruns",
    # Anclado a la raíz: "models" sin "/" excluiría cualquier segmento de
    # ruta llamado "models", incluyendo `src/real_estate/models/` (N806
    # quedaba silenciado para todo el paquete). "/models" solo excluye el
    # directorio de salida `models/` en la raíz del proyecto.
    "/models",
]


[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # Import sorting
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "SIM",    # flake8-simplify
]

ignore = [
    "E501",   # Line length handled by Ruff formatter
]

[tool.ruff.lint.per-file-ignores]
# `X` es la convención estándar de SHAP/matplotlib para la matriz de features.
"src/real_estate/explainability/shap_analysis.py" = ["N803"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


# ============================================================
# Mypy
# ============================================================

[tool.mypy]
python_version = "3.12"

files = ["src", "tests"]

# Equipara el chequeo local con el de CI: en CI el paquete se instala con
# `pip install -e .` y mypy lo encuentra; sin él, los imports de
# `real_estate` se resuelven como "módulo faltante" y todo se tipa como Any.
mypy_path = ["src"]

strict = true

warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true

ignore_missing_imports = true


# ============================================================
# Coverage
# ============================================================

[tool.coverage.run]
branch = true
source = ["src/real_estate"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

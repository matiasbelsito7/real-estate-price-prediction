repos:
  # ==========================================================
  # Ruff
  # ==========================================================

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.8
    hooks:
      - id: ruff-check
        args: [--fix]

      - id: ruff-format


  # ==========================================================
  # Mypy
  # ==========================================================

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        additional_dependencies:
          - pandas-stubs
          - types-requests
          # pytest (con py.typed) para tipar los decoradores
          # @pytest.mark.parametrize y @pytest.fixture de los tests.
          - pytest


  # ==========================================================
  # General file checks
  # ==========================================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args:
          - --maxkb=1000
